# cargo-deny 配置：依赖许可证白名单 + 来源约束（AGPL 合规，见 gates.md）

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "MPL-2.0",
  "BSL-1.0",
  "CC0-1.0",
  "AGPL-3.0-only",
  # CDLA-Permissive-2.0：宽松数据许可证（无 copyleft，AGPL 兼容）。webpki-roots（reqwest
  # rustls-tls 引入的 Mozilla CA 根证书数据包，纯数据）用此证。个案审通过（M1a）。
  "CDLA-Permissive-2.0",
]

[advisories]
version = 2
yanked = "warn"
ignore = [
  # RUSTSEC-2026-0459（CVE-2026-119375）：SQLite <3.54 页缓存内存泄露，本地向量，
  # 需打开不可信方 crafted 的 DB+wal 文件对。godoword 自建自有 DB（/data），从不打开
  # 外部 DB 文件，攻击前提不成立。sqlx 0.8/0.9 均 pin libsqlite3-sys <0.38（无 patched 0.39）；
  # 上游支持后升级并移除此忽略（见 roadmap 远期）。风险接受决策见 history。
  "RUSTSEC-2026-0459",
  # RUSTSEC-2026-0543：chrono 宣布 unmaintained（维护状态告警，非安全漏洞）。所有版本受影响，
  # 无安全升级路径（官方建议 jiff/time）。sqlx-core 传递依赖 chrono，kernel-api 契约类型直接用
  # chrono::DateTime——即便换直接 usage，sqlx 仍带 chrono 入树，替换不可行（需 sqlx 上游切换）。
  # chrono 0.4 成熟稳定、生态海量使用；风险为未来修复可能不及时。监控社区 fork/复活，
  # sqlx 切换或 maintained fork 出现时重审并移除此忽略（见 roadmap 远期）。风险接受决策见 history。
  "RUSTSEC-2026-0543",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]