# 术语表：规范词 + 禁用别名。CI 机械扫描禁用别名（本文件自身除外）。
# 新术语须同 PR 入表。写作前查本表。
terms:
  - canonical: 内核
    banned: [核心模块]
    definition: kernel，配置/存储/加密/会话/运行时/注册/outbox/计量
  - canonical: 适配器
    banned: [适配模块, 驱动模块]
    definition: 实现 LlmProvider/TtsProvider/AuthProvider 的协议适配 crate
  - canonical: 教学模块
    banned: [课程模块, 学习模块]
    definition: 实现 TeachingModule 的模块，自带路由/前端/工具/进度事件
  - canonical: 评估模块
    banned: [评测模块]
    definition: teach-assess，实现 PlanProvider，教学核心
  - canonical: 契约
    banned: [接口约定]
    definition: kernel-api 中的 trait 与类型
  - canonical: 组合根
    banned: [主程序]
    definition: godoword bin crate，feature 注册各模块
  - canonical: 模块清单
    banned: [模块配置]
    definition: module.yaml
  - canonical: 绑定
    banned: [关联配置]
    definition: bindings 表，用户/模块/能力/role 到 provider+model 的映射
  - canonical: 预设
    banned: [预置]
    definition: 配置文件中的 provider 模板（不含 key）
  - canonical: 密钥
    banned: [秘钥]
    definition: 用户 API key（CS 英文词 key 允许）
  - canonical: 主密钥
    banned: [主秘钥, 根密钥]
    definition: master key，静态加密用户密钥
  - canonical: 教学方案
    banned: [学习计划, 教学规划]
    definition: LearningPlan，structured + teacher_prompt
  - canonical: 会话
    banned: [对话会话]
    definition: session，用户与某教学模块的一次持续交互
  - canonical: 回合
    banned: [运行轮]
    definition: run，一次用户消息触发的完整 LLM 循环（讨论轮次用 round 区分）
  - canonical: 进度事件
    banned: [学习事件]
    definition: ProgressEvent，持久 outbox 中的结构化事件
  - canonical: 提取报告
    banned: [进度报告]
    definition: 评估模块从转录异步提取的教学进度报告
  - canonical: 转录
    banned: [对话记录]
    definition: transcript，持久化的会话消息全文
  - canonical: 关系图谱
    banned: [依赖图, 影响图]
    definition: impact 规则构成的文件→文档牵连图
  - canonical: 门禁
    banned: [卡点, 检查器]
    definition: CI 与提交前的强制检查
  - canonical: 运行时
    banned: [执行器]
    definition: agent runtime，kernel 的回合循环
  - canonical: 淘汰
    banned: [驱逐]
    definition: eviction，上下文超预算时移出历史
  - canonical: 摘要
    banned: [总结]
    definition: summarize，淘汰时 LLM 压缩历史（opt-in）
  - canonical: 邀请码
    banned: [注册码]
    definition: invite code，invite 注册模式凭据
  - canonical: 冒烟测试
    banned: [烟雾测试]
    definition: smoke test，确定性 CLI 自动化验收（scripts/acceptance/smoke.sh）
  - canonical: 人工残留验收
    banned: [人工冒烟]
    definition: 自动化覆盖不到、需人类判断或访问权的验收项
  - canonical: 存储分发
    banned: [存储抽象]
    definition: Store enum 双具体驱动薄分发，不隐藏方言
  - canonical: 双兼容 SQL 子集
    banned: [双兼容SQL子集, 通用SQL子集, 双兼容子集]
    definition: SQLite 与 PostgreSQL 双兼容的 SQL 约定子集
  - canonical: 双后端测试
    banned: [双数据库测试]
    definition: CI 对 SQLite + PostgreSQL 真测（storage required check）
  - canonical: 入门指南
    banned: []
    definition: AGENTS.md，无上下文 agent 的入口地图与接续协议
  - canonical: 交接状态
    banned: []
    definition: docs/project/status.md，live 工作状态（committed，随仓库走）
  - canonical: 白名单缓存
    banned: [指纹缓存]
    definition: 模块显式声明稳定 key 的可缓存音频（机制 M2 P1 已落 get_or_synthesize，用户侧 gojuon 标准音频消费者 P4），同一性由模块权威声明而非指纹 hash 推断，持久资产区豁免淘汰
  - canonical: 新鲜合成
    banned: []
    definition: 音频默认每次新合成不复用（无白名单标记），随机 AudioId 存供回放
  - canonical: 持久资产
    banned: [静态资产, 内置音频]
    definition: 用户侧生成的 canonical 音频（如五十音标准发音），/data/assets 持久资产区豁免 TTL/容量淘汰，一次生成永久使用（卷损毁按需懒再生），稳定 key 直供（M2 P1 机制已落，gojuon 消费者 P4）；静态入仓库方案因 AGPL 再分发前提作废（history 1721）
  - canonical: 角色扮演
    banned: [角色模拟]
    definition: 横切声音基础设施，地基 persona/binding/voice 原语 + 模块编排，内核角色音色档案实体（M2+ 推迟）
  - canonical: 回放
    banned: []
    definition: 某次合成的音频再放一遍（per-synthesis AudioId，GET /audio/{id}），与复用（跨请求省合成）区分
  - canonical: 虚拟路径
    banned: []
    definition: 会话文件夹的路径即身份模型（sessions.path，如 /日语/五十音），NFC 归一化 + 固定上限（深度≤8/段≤64/全路径≤1024），前端 trie 渲染（M1d）
  - canonical: 会话文件夹
    banned: []
    definition: 虚拟路径表达的会话分组，登记表 session_folders 持久空文件夹，模块 chroot 命名空间，删非空文件夹子会话上移一层（M1d）
  - canonical: 命名空间
    banned: []
    definition: 会话文件夹的模块隐式根（chroot），module_id 创建时固定杜绝跨模块移动；M1 哨兵 default 存量经 0006 迁入 teach-free，新会话/文件夹查询缺省 teach-free（M2 P1/T4）
  - canonical: 主题引擎
    banned: []
    definition: CSS 自定义属性 + 预设 + 用户自定义变量/高级 CSS 的 WebUI 美化体系，偏好跨设备随账户（M1d）
  - canonical: 用户偏好
    banned: []
    definition: user_preferences 表 + GET/PUT REST，跨设备随账户（theme/auto_play/on_disconnect_default/密度/字号等），用户级配置仅 DB+webui（M1d）
  - canonical: 音色试听
    banned: []
    definition: 设置页选音色时合成一句试听（POST /providers/{id}/preview，固定短文本+可选自定义，走用户 key 计量），BYOK 选音色闭环（M1d）
  - canonical: 定级
    banned: [分级测试]
    definition: placement，新用户冷启动评估（自评问卷 + 确定性迷你测 + 可选 LLM 短测）→ 初始教学方案（M2）
  - canonical: 操练
    banned: [刷题]
    definition: 结构化练习卡（识别/听音/认读，模块确定性判对错），发结构化进度事件 ExerciseOutcome（M2）
  - canonical: 课时
    banned: [课程单元]
    definition: lesson，一课三段式（引入对话→操练→收尾对话），新授课/复习课两类，一行/组 ~5 项（M2）
  - canonical: 掌握度
    banned: [熟练度]
    definition: 假名项掌握程度（进度事件对错聚合），gojuon 热力图可视化（M2）
  - canonical: 模块注册表
    banned: [模块列表]
    definition: kernel 运行时反序列化 module.yaml（noyalib）+ feature 注册教学模块 + 注册校验（M2 P1 已落）；迁移编排（kernel→模块注册序）runner 归 P2
  - canonical: 自由对话
    banned: [自由聊天]
    definition: teach-free 轻量教学模块（T4 决议），内核默认 persona 移入，plan 可选，既有无模块会话经 0006 迁入（M2 P1 已落）
  - canonical: 默认节奏
    banned: []
    definition: gojuon 在 current_plan=None 时的内置兜底节奏（固定顺序、不跳过已会），placement 随时可补不强制（M2，审计 UX-A1）
  - canonical: ctx 工厂
    banned: []
    definition: ModuleContextFactory（for_session/for_user），每模块一实例 module_id 构造期绑定，组合根注入模块（M2 P1，B3 定案 session_id Option）
  - canonical: 完成语义
    banned: []
    definition: complete_session 完成≠删除（completed_at + session-ended 事件，转录保留触发提取，幂等）；DELETE 隐私删除不发事件归 P2（M2 P1，审计 B2）
  - canonical: 用户级备份
    banned: [账户搬家]
    definition: 用户自助导出/导入用户级资料与音频（单 ZIP，不含 API key 导入重填，恢复向不做合并），设计定案实施 M2 后（history 1721）