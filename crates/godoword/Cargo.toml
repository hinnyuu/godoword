[package]
name = "godoword"
description = "godoword 组合根：注册模块并启动服务"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "godoword"
path = "src/main.rs"

[features]
default = []
# DEV-DEBT T1：开发态 env key 旁路 + 固定 dev user，仅本地开发测试用，release 永不启用，M1c 删除。
# M1a 适配器随 dev-bypass 编译（release M1a 无回合能力，M1b/c 转正式绑定后改为非 optional）。
dev-bypass = ["dep:llm-openai", "dep:tts-qwen-audio"]

[dependencies]
kernel-api.workspace = true
kernel.workspace = true
llm-openai = { workspace = true, optional = true }
tts-qwen-audio = { workspace = true, optional = true }
async-trait.workspace = true
axum = { workspace = true, features = ["http1", "json", "tokio"] }
bytes.workspace = true
futures-util.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net"] }
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = "0.3"
uuid.workspace = true