[package]
name = "godoword"
description = "godoword 组合根：注册模块并启动服务"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "godoword"
path = "src/main.rs"

[dependencies]
kernel-api.workspace = true
kernel.workspace = true
auth-local.workspace = true
llm-openai.workspace = true
tts-qwen-audio.workspace = true
teach-free = { workspace = true, optional = true }
async-trait.workspace = true
axum = { workspace = true, features = ["http1", "json", "tokio", "query"] }
bytes.workspace = true
chrono.workspace = true
futures-util.workspace = true
ipnet.workspace = true
nix.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "time"] }
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = "0.3"
uuid.workspace = true
utoipa.workspace = true
[features]
default = ["teach-free"]
teach-free = ["dep:teach-free"]
