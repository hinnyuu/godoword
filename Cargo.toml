[workspace]
resolver = "2"
members = ["crates/kernel-api", "crates/kernel", "crates/llm-openai", "crates/tts-qwen-audio", "crates/godoword"]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/hinnyuu/godoword"
rust-version = "1.85"

[workspace.dependencies]
kernel-api = { path = "crates/kernel-api" }
kernel = { path = "crates/kernel" }
llm-openai = { path = "crates/llm-openai" }
tts-qwen-audio = { path = "crates/tts-qwen-audio" }
aes-gcm = "0.10"
async-stream = "0.3"
async-trait = "0.1"
axum = { version = "0.8", default-features = false }
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
futures-core = "0.3"
futures-util = "0.3"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "postgres", "uuid", "chrono", "json", "migrate", "macros", "runtime-tokio"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
toml = "0.8"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

[profile.dev]
opt-level = 0
debug = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true