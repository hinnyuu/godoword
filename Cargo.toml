[workspace]
resolver = "2"
members = ["crates/kernel-api", "crates/godoword"]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/hinnyuu/godoword"
rust-version = "1.85"

[workspace.dependencies]
kernel-api = { path = "crates/kernel-api" }
async-trait = "0.1"
axum = { version = "0.8", default-features = false }
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
futures-core = "0.3"
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "postgres", "uuid", "chrono", "json", "migrate", "macros", "runtime-tokio"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[profile.dev]
opt-level = 0
debug = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true